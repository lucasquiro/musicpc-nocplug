## EN: Declares MusicPC catalog metadata, runtime dependencies, and Noctalia entry scripts.
## ES: Declara los metadatos de catálogo, dependencias y scripts de entrada de Noctalia para MusicPC.
id         = "lucasquiro/musicpc-nocplug"
name       = "MusicPC"
version    = "0.2.3"
plugin_api = 34
author     = "lucasquiro"
license    = "MIT"
description = "Control an MPD player from the bar with queue, playlists, library browsing, and MP3 metadata editing."
tags       = ["music", "media", "audio", "bar", "panel", "service"]
dependencies = ["mpc", "python3", "ffmpeg", "gio"]
icon       = "music"

[[service]]
id    = "mpd"
entry = "service.luau"

[[widget]]
id    = "player"
entry = "widget.luau"

[[panel]]
id        = "queue"
entry     = "panel.luau"
width     = 400
height    = 480
placement = "attached"
open_near_click = true
